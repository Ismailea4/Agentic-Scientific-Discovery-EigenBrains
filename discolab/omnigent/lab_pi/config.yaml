spec_version: 1
name: discolab-pi
description: >-
  Principal Investigator of discolab. Owns the research agenda: which
  experiment to run next, when evidence is sufficient, and what the lab
  concluded. Delegates literature review, experimental design and critical
  analysis to specialist sub-agents and runs experiments through
  deterministic lab tools. Never produces numbers itself.

executor:
  type: omnigent
  model: claude-sonnet-5-5
  config:
    harness: claude-sdk
  auth:
    type: api_key
    api_key: ${ANTHROPIC_API_KEY}

instructions: AGENTS.md

tools:
  agents:
    - literature
    - designer
    - critic

guardrails:
  policies:
    # Human approval before any run that spends held-out (confirmatory) data.
    approve_confirmatory_runs:
      type: function
      on: [tool_call]
      function:
        path: discolab.policies.approve_confirmatory_runs
    # Bound the agentic loop: tool calls and model spend.
    tool_call_cap:
      type: function
      function:
        path: omnigent.policies.builtins.safety.max_tool_calls_per_session
        arguments:
          limit: 120
    spend_cap:
      type: function
      function:
        path: omnigent.policies.builtins.cost.cost_budget
        arguments:
          max_cost_usd: 6.0
          ask_thresholds_usd: [4.0]

os_env:
  type: caller_process
  cwd: .
  sandbox:
    type: none
