# discolab pre-registration — frozen before any confirmatory or comparative run.
# Changing anything below after the first experiment requires a new prereg
# version; the ledger records the SHA-256 of this file with every event.
version: 4
frozen_on: "2026-10-04"

changelog:
  - version: 4
    date: "2026-10-04"
    reason: >-
      Additions only; nothing earlier changes. Run 2's failure-dependence
      analysis (EigenBrains covariance layer) found that the entropy-risk
      controller and the rate-matched fixed rate fail on largely different runs,
      motivating a combined controller (B5) and hypothesis H8, registered here
      before any test. The planner also proposes a research portfolio per round.
    deviations:
      - >-
        New controller variant B5_hybrid (rate-matched base 0.8/d, burst to
        p_max for 5 generations on a rising edge of predicted risk >= 0.5;
        risk model on fitness+entropy, fitted on fresh development seeds) and
        hypothesis H8.
      - >-
        Research portfolio: each scoring round also reports up to 3 experiments
        chosen greedily by marginal joint information (exact for conditionally
        independent verdicts) minus cost and held-out penalties. Selection of an
        individual experiment and every analysis rule are unchanged.
  - version: 3
    date: "2026-10-04"
    reason: >-
      Run 2 (under v2, results/run2_prereg_v2) labelled H3 "refuted" (posterior
      0.019) from an inconclusive verdict whose CI still included effects above
      the SESOI; the PI flagged it. Cause: H1 was a single assumed effect size,
      so "inconclusive" ruled out that size, not every meaningful effect.
      Hypotheses, metrics, splits and verdict definitions are unchanged.
    deviations:
      - >-
        Composite alternative. Under H1 the standardised effect is a practically
        meaningful effect of uncertain size, SESOI + HalfNormal(scale = assumed
        effect), rather than one point value; outcome likelihoods average over
        it (40-node quadrature).
      - >-
        Status consistency. A hypothesis is "supported" only if its posterior is
        >= 0.9 AND at least one direct verdict was "supported"; "refuted" only if
        the posterior is <= 0.1 AND at least one direct verdict was "refuted".
        Coupled priors move the posterior of untested hypotheses but never
        decide their status.
  - version: 2
    date: "2026-10-04"
    reason: >-
      Run 1 (pilot under v1, results/run1_prereg_v1) exposed flaws in the planner
      and in secondary analyses. Hypotheses H1-H4, primary metrics, landscape
      splits, decision rules and verdict definitions are unchanged.
    deviations:
      - >-
        Planner outcome model. v1 set P(refuted|H0) equal to the design power,
        which made an inconclusive verdict raise a posterior (H3 0.5 -> 0.667 in
        run 1). v2 uses a normal sampling model of the standardised estimate
        with the smallest effect of interest (see planner_policy.outcome_model).
      - >-
        Assumed effect for planning. v1 used the latest measured effect in the
        family, which depended on update order (H1 inherited H3's near-zero
        effect in run 1). v2 uses the hypothesis's own latest measurement, else
        the mean of the family's latest measurements, floored at 0.1.
      - >-
        Recovery-rate intervals. v1 used Wilson intervals over shifts, treating
        the 5 shifts of a run as independent. v2 uses a run-clustered bootstrap;
        McNemar on rescue/damage is kept as descriptive only.
      - >-
        Cost model. v1 underestimated wall time about 5x. v2 calibrates seconds
        per weighted generation from completed runs once any exist.
      - >-
        Hypotheses H5-H7 added. They were generated by the lab's agents in run 1
        and are registered here before run 2 (origin recorded per hypothesis).
      - >-
        Comparisons. Hypotheses may name a comparison baseline (prediction) or a
        comparator (control); new feature set fitness+dispersion+entropy;
        controller variants B3d_predictive and rate-matched B0_fixed_x<m>.
      - >-
        Seeds. Allocation is offset so no v2 experiment reuses a run-1 seed.

question: >-
  Do the dynamics of population entropy carry early-warning information about
  imminent search stagnation in a genetic algorithm, beyond what the fitness
  history already reveals, and can that signal drive a mutation intervention
  that recovers faster after the landscape changes?

hypotheses:
  - id: H1
    family: prediction
    statement: >-
      Adding population-entropy features (H_t, dH_t) to fitness-history features
      improves out-of-sample AUROC for predicting stagnation onset.
    h0: Entropy features add no predictive information (delta AUROC <= 0).
    feature_set: fitness+entropy
    prior: 0.5
  - id: H2
    family: prediction
    statement: >-
      Adding genotypic dispersion features (D_t, dD_t) to fitness-history
      features improves out-of-sample AUROC for predicting stagnation onset.
    h0: Dispersion features add no predictive information.
    feature_set: fitness+dispersion
    prior: 0.5
  - id: H3
    family: prediction
    statement: >-
      Adding fitness-spread features (population log-error dispersion), which
      need no genotype access, improves out-of-sample AUROC for stagnation onset.
    h0: Fitness-spread features add no predictive information.
    feature_set: fitness+spread
    prior: 0.5
  - id: H4
    family: control
    statement: >-
      A mutation controller driven by the frozen stagnation-risk model (B3)
      lowers restricted mean recovery time after landscape shifts compared
      with the strongest non-oracle baseline.
    h0: B3 does not recover faster than the strongest baseline.
    controller: B3_predictive
    comparator: best_baseline
    # Prior coupling: a predictive controller is only plausible if the signal predicts.
    prior_rule: {depends_on: H1, if_true: 0.5, if_false: 0.1}
  - id: H5
    origin: run1-agent (critic, after E2 supported dispersion)
    family: prediction
    statement: >-
      Entropy features add predictive information beyond genotypic dispersion:
      fitness+dispersion+entropy beats fitness+dispersion in out-of-sample AUROC.
    h0: Entropy adds nothing once dispersion is known.
    feature_set: fitness+dispersion+entropy
    baseline_feature_set: fitness+dispersion
    prior: 0.5
  - id: H6
    origin: run1-agent (critic, after E4 showed B3 mutated less than B0)
    family: control
    statement: >-
      The entropy-risk controller B3 recovers faster than a fixed mutation rate
      matched to its average rate (0.8/d), i.e. timing matters, not just rate.
    h0: B3 is no faster than the rate-matched fixed controller.
    controller: B3_predictive
    comparator: B0_fixed_x0.8
    prior: 0.5
  - id: H7
    origin: run1-agent (PI decision after E2 and E4)
    family: control
    statement: >-
      A predictive controller whose frozen risk model uses dispersion instead of
      entropy (B3d) lowers restricted mean recovery time compared with the
      strongest non-oracle baseline.
    h0: B3d does not recover faster than the strongest baseline.
    controller: B3d_predictive
    comparator: best_baseline
    prior_rule: {depends_on: H2, if_true: 0.5, if_false: 0.1}
  - id: H8
    origin: run2-analysis (failure dependence between B3 and the rate-matched rate)
    family: control
    statement: >-
      A hybrid controller that keeps the rate-matched base rate 0.8/d and adds
      predicted-stagnation bursts (B5) recovers faster than the rate-matched
      fixed rate alone, i.e. predictive timing adds value on top of the rate.
    h0: B5 is no faster than the rate-matched fixed controller.
    controller: B5_hybrid
    comparator: B0_fixed_x0.8
    prior_rule: {depends_on: H1, if_true: 0.5, if_false: 0.1}

landscapes:
  development: [rastrigin, ackley]
  held_out: [griewank, levy, styblinski_tang]
  excluded:
    schwefel: optimum near the box corner and unbounded descent outside it; translation ill-posed

ga:
  dim: 10
  pop_size: 50
  crossover: SBX(eta=15, p=0.9)
  mutation: per-gene Gaussian, sigma = 0.05 * box width, rate set by the controller
  selection: binary tournament
  elitism: 1 (re-evaluated every generation)
  p_mut_range: [0.5/d, 4/d]
  entropy: mean per-dimension normalised Shannon entropy, 10 fixed bins over the box

seeds:
  development: [0, 4999]
  test: [5000, 8999]
  calibration: [9000, 9999]
  experiment_offset: 20
  allocation: >-
    experiment j uses block_start + 100*(experiment_offset + j) + i (risk-model
    and training runs add 50), so no two experiments share runs and no v2 run
    reuses a v1 seed

prediction_study:
  label: no improvement event (>0.1% drop in best error) within K generations
  horizon_K: 10
  at_risk: generations with an improvement event; windows crossing a shift excluded
  static_generations: 200
  data_policies: [B0_fixed_x0.5, B0_fixed_x1, B0_fixed_x2]
  baseline_features: fitness   # rel. log best error, its 1/5/10-gen changes, stall, log generation
  model: L2 logistic regression (lambda = 0.01) on standardised features
  primary_metric: >-
    test AUROC difference between a hypothesis's feature set and its comparison
    baseline (fitness unless stated), paired run-cluster bootstrap (2000),
    stratified by landscape
  dev_stage: leave-one-landscape-out across development landscapes
  confirmatory_stage: train on development landscapes, test on held-out landscapes

control_study:
  epochs: 6            # epoch 0 is static burn-in; 5 shifts follow
  period_generations: 60
  severity: 0.2        # shift length as a fraction of the box half-width
  max_offset: 0.5
  controllers: [B0_fixed, B1_stall, B2_entropy, B3_predictive, B4a_hypermutation, B4b_immigrants]
  controller_variants:
    B3d_predictive: B3 with a risk model on fitness+dispersion
    B5_hybrid: base 0.8/d; burst to p_max for 5 generations when predicted risk crosses 0.5 (rising edge)
    B0_fixed_x<m>: fixed rate m/d, 0.25 <= m <= 4 (rate-matched controls)
  risk_models: logistic on the variant's feature set, fitted on fresh development seeds only, then frozen
  recovery_target: >-
    eps_f = median over calibration seeds (B0 only) and post-shift epochs of the
    best error at the end of each epoch. Chosen in a B0-only development pilot
    because a burn-in-level target gave a recovery ceiling (B0 recovered 97-100%).
  primary_metric: restricted mean recovery time (generations, censored at the period)
  secondary_metrics:
    - recovery rate (mean of per-run rates, run-clustered bootstrap)
    - change in recovery rate vs B0 (paired, run-clustered bootstrap)
    - rescue/damage counts vs B0 (exact McNemar reported as descriptive only)
    - CVaR90 of recovery time
    - offline error / eps
  analysis: >-
    paired by (landscape, seed); stratified bootstrap (4000) of mean difference;
    Wilcoxon; Holm across controllers; hypothesis contrasts against the named
    comparator, or the strongest non-predictive baseline when best_baseline

decision_rules:
  alpha: 0.05
  smallest_effect_of_interest:
    prediction_delta_auroc: 0.01
    control_rmst_generations: 1.0
  verdicts:
    supported: 95% CI excludes zero in the hypothesised direction
    refuted: 95% CI lies entirely inside (-inf, SESOI) for the hypothesised direction
    inconclusive: otherwise
  hypothesis_status: >-
    supported if posterior >= 0.9 and some direct verdict was supported;
    refuted if posterior <= 0.1 and some direct verdict was refuted; else open

planner_policy:   # deterministic experiment selection (EigenBrains constrained utility)
  utility: EIG_bits - eta * wall_seconds - lambda_heldout * heldout_landscapes_used
  eta_bits_per_second: 0.001667     # 10 minutes of compute costs one bit
  lambda_heldout_bits: 0.05
  outcome_model: >-
    standardised estimate ~ N(delta, 1/n) over n independent units;
    P(supported) = Phi(delta*sqrt(n) - z); P(refuted) = Phi((s - delta)*sqrt(n) - z);
    delta = s + HalfNormal(scale = assumed effect) under H1 (likelihoods
    averaged over it) and delta = 0 under H0; s = standardised SESOI
  assumed_standardised_effect: 0.5        # used until a measurement exists
  min_assumed_standardised_effect: 0.1    # floor for H1's assumed effect
  default_sesoi_standardised: 0.2         # until a family measurement gives the per-unit SD
  cost_model: measured benchmark until a run completes, then median wall seconds per weighted generation
  hard_constraints:
    - cost within remaining compute budget
    - confirmatory (held-out) test of a hypothesis only after a completed development-stage test of it
  approximations:
    - EIG of an experiment is the sum over the hypotheses it tests (treated as independent)
    - an untested hypothesis with a prior_rule takes its prior from its parent's current posterior
  compute_budget_seconds: 1800
  portfolio:
    max_experiments: 3
    min_marginal_utility_bits: 0.01
    value: sum over hypotheses of exact joint information of the experiments testing it, minus penalties
    selection: greedy by marginal value (submodular objective; (1 - 1/e) guarantee)

claims_policy:
  - Results are reported whatever their direction; refuted hypotheses stay in the record.
  - Literature evidence is recorded only with verified OpenAlex identifiers whose title matches the cited title.
  - Agent-generated hypotheses are labelled as such; numbers come only from tools.
